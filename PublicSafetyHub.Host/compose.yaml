name: publicsafetyhub

services:
  database:
    image: postgres:18
    container_name: publicsafetyhub-db
    environment:
      POSTGRES_DB: PublicSafetyHub
      POSTGRES_USER: publicsafetyhub
      POSTGRES_PASSWORD: publicsafetyhub_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
